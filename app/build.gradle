plugins {
    id 'com.android.application'
}

android {
    namespace 'k.p.main'
    compileSdk 35
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "k.p.main"
        // 现代化:minSdk 26(Android 8.0,TYPE_APPLICATION_OVERLAY 统一)、targetSdk 35
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true   // 原版 APK 含 BuildConfig 类,保持一致
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Original APK shipped a single armeabi lib (libencrypt.so)
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}
