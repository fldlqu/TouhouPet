plugins {
    id 'com.android.application'
}

android {
    namespace 'k.p.main'
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "k.p.main"
        // 现代化:minSdk 26(Android 8.0)、targetSdk 36(Android 16)
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 签名:debug key 顶替(现阶段无关紧要;将来可换正式 keystore)
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true   // 原版 APK 含 BuildConfig 类,保持一致
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_26
        targetCompatibility JavaVersion.VERSION_26
    }

    // Original APK shipped a single armeabi lib (libencrypt.so)
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}
