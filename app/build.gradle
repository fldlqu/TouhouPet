plugins {
    id 'com.android.application'
}

android {
    namespace 'k.p.main'
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "k.p.main"
        // 现代化:minSdk 26(Android 8.0)、targetSdk 36(Android 16)
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName "1.1.0"
        // 开发者测试面板开关(自用测试默认开;发布时改为 false)
        buildConfigField "boolean", "DEV_PANEL", "true"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 签名:debug key 顶替(现阶段无关紧要;将来可换正式 keystore)
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true   // 原版 APK 含 BuildConfig 类,保持一致
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_24
        targetCompatibility JavaVersion.VERSION_24
    }



    // Original APK shipped a single armeabi lib (libencrypt.so)
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

// 内置 Kotlin 最高支持 JVM target 24(Java 26 与 Kotlin 24 混合,dex 统一无冲突)
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_24
    }
}

dependencies {
    // 架构现代化:协程(AGP 9 内置 Kotlin,无需额外插件)
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"

    // 单元测试(JVM 本地,不进 APK)
    testImplementation "junit:junit:4.13.2"
}
